# ラボ全体の共通設定。各スクリプトが source する。
# IP やトポロジの設計根拠は plan/02-architecture.md を参照。

LAB_VM_PREFIX="lab-"            # libvirt 上のドメイン名プレフィックス(lab-r1 など)
VMS="r1 r2 r3 client1 client2"
ROUTERS="r1 r2 r3"
CLIENTS="client1 client2"

# ディレクトリ・ファイル
IMAGES_DIR="images"             # ダウンロード/ビルドしたイメージ(git 管理外)
BUILD_DIR="build"               # 差分ディスク・seed ISO などの生成物(git 管理外)
KEY_FILE="keys/lab_ed25519"     # ラボ専用 SSH 鍵(無ければ自動生成)

# イメージ
VYOS_ISO="$IMAGES_DIR/vyos-rolling.iso"
VYOS_BASE="$IMAGES_DIR/vyos-base.qcow2"
ALPINE_BASE="$IMAGES_DIR/alpine-base.qcow2"
ALPINE_BRANCH="v3.22"           # Alpine の系列。上げる場合はここを変更
VYOS_DISK_GB=10

# VM スペック(plan/01-requirements.md)
RAM_router=1024
RAM_client=256
VCPUS=1

# 管理ネットワーク(172.16.99.0/24, GW=ホスト .1)
MGMT_IP_r1="172.16.99.11"
MGMT_IP_r2="172.16.99.12"
MGMT_IP_r3="172.16.99.13"
MGMT_IP_client1="172.16.99.21"
MGMT_IP_client2="172.16.99.22"

# VM ごとの NIC 接続順(ゲスト内の eth0, eth1, eth2 に対応)
NETS_r1="labnet-mgmt labnet-lan-a labnet-wan-a"
NETS_r2="labnet-mgmt labnet-wan-a labnet-wan-b"
NETS_r3="labnet-mgmt labnet-lan-b labnet-wan-b"
NETS_client1="labnet-mgmt labnet-lan-a"
NETS_client2="labnet-mgmt labnet-lan-b"
