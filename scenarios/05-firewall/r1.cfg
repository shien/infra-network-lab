# 05-firewall: r1 — 04-bgp の構成 + ステートフルファイアウォール
# ポリシー: LAN-A -> WAN は許可、WAN -> LAN-A は戻りトラフィックと ICMP のみ許可
set interfaces ethernet eth1 address '192.168.10.1/24'
set interfaces ethernet eth1 description 'LAN-A'
set interfaces ethernet eth2 address '10.0.12.1/30'
set interfaces ethernet eth2 description 'WAN to r2'
set interfaces loopback lo address '10.255.0.1/32'
set protocols bgp system-as '65001'
set protocols bgp parameters router-id '10.255.0.1'
set protocols bgp neighbor 10.0.12.2 description 'r2 (AS65000)'
set protocols bgp neighbor 10.0.12.2 remote-as '65000'
set protocols bgp neighbor 10.0.12.2 address-family ipv4-unicast
set protocols bgp address-family ipv4-unicast network 192.168.10.0/24
set service dhcp-server shared-network-name LAN-A subnet 192.168.10.0/24 subnet-id '1'
set service dhcp-server shared-network-name LAN-A subnet 192.168.10.0/24 option default-router '192.168.10.1'
set service dhcp-server shared-network-name LAN-A subnet 192.168.10.0/24 option name-server '192.168.10.1'
set service dhcp-server shared-network-name LAN-A subnet 192.168.10.0/24 range 0 start '192.168.10.100'
set service dhcp-server shared-network-name LAN-A subnet 192.168.10.0/24 range 0 stop '192.168.10.199'
set service dhcp-server shared-network-name LAN-A subnet 192.168.10.0/24 lease '3600'
set firewall ipv4 forward filter default-action 'drop'
set firewall ipv4 forward filter default-log
set firewall ipv4 forward filter rule 10 description 'allow return traffic'
set firewall ipv4 forward filter rule 10 action 'accept'
set firewall ipv4 forward filter rule 10 state 'established'
set firewall ipv4 forward filter rule 10 state 'related'
set firewall ipv4 forward filter rule 20 description 'allow LAN-A -> WAN'
set firewall ipv4 forward filter rule 20 action 'accept'
set firewall ipv4 forward filter rule 20 inbound-interface name 'eth1'
set firewall ipv4 forward filter rule 30 description 'allow ICMP from WAN'
set firewall ipv4 forward filter rule 30 action 'accept'
set firewall ipv4 forward filter rule 30 protocol 'icmp'
set firewall ipv4 forward filter rule 30 log
