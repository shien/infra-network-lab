# 05-firewall: r2 — 04-bgp と同じ(AS65000, トランジット)
set interfaces ethernet eth1 address '10.0.12.2/30'
set interfaces ethernet eth1 description 'WAN to r1'
set interfaces ethernet eth2 address '10.0.23.1/30'
set interfaces ethernet eth2 description 'WAN to r3'
set interfaces loopback lo address '10.255.0.2/32'
set protocols bgp system-as '65000'
set protocols bgp parameters router-id '10.255.0.2'
set protocols bgp neighbor 10.0.12.1 description 'r1 (AS65001)'
set protocols bgp neighbor 10.0.12.1 remote-as '65001'
set protocols bgp neighbor 10.0.12.1 address-family ipv4-unicast
set protocols bgp neighbor 10.0.23.2 description 'r3 (AS65002)'
set protocols bgp neighbor 10.0.23.2 remote-as '65002'
set protocols bgp neighbor 10.0.23.2 address-family ipv4-unicast
