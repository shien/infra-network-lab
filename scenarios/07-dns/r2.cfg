# 07-dns: r2 — 01-lan と同じ(WAN アドレスと両 LAN への静的経路)
set interfaces ethernet eth1 address '10.0.12.2/30'
set interfaces ethernet eth1 description 'WAN to r1'
set interfaces ethernet eth2 address '10.0.23.1/30'
set interfaces ethernet eth2 description 'WAN to r3'
set protocols static route 192.168.10.0/24 next-hop '10.0.12.1'
set protocols static route 192.168.20.0/24 next-hop '10.0.23.2'
