# 07-dns: r1 — 01-lan の構成 + ラボ内 DNS サーバ(static-host-mapping を DNS で返す)
set interfaces ethernet eth1 address '192.168.10.1/24'
set interfaces ethernet eth1 description 'LAN-A'
set interfaces ethernet eth2 address '10.0.12.1/30'
set interfaces ethernet eth2 description 'WAN to r2'
set protocols static route 192.168.20.0/24 next-hop '10.0.12.2'
set protocols static route 10.0.23.0/30 next-hop '10.0.12.2'
set system static-host-mapping host-name r1.lab inet '192.168.10.1'
set system static-host-mapping host-name r2.lab inet '10.0.12.2'
set system static-host-mapping host-name r3.lab inet '192.168.20.1'
set system static-host-mapping host-name client1.lab inet '192.168.10.100'
set system static-host-mapping host-name client2.lab inet '192.168.20.100'
set service dns forwarding listen-address '192.168.10.1'
set service dns forwarding listen-address '10.0.12.1'
set service dns forwarding allow-from '192.168.0.0/16'
set service dns forwarding allow-from '10.0.0.0/8'
