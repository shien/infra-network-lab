# 02-dhcp: r3 — 01-lan の構成 + LAN-B への DHCP サーバ
set interfaces ethernet eth1 address '192.168.20.1/24'
set interfaces ethernet eth1 description 'LAN-B'
set interfaces ethernet eth2 address '10.0.23.2/30'
set interfaces ethernet eth2 description 'WAN to r2'
set protocols static route 192.168.10.0/24 next-hop '10.0.23.1'
set protocols static route 10.0.12.0/30 next-hop '10.0.23.1'
set service dhcp-server shared-network-name LAN-B subnet 192.168.20.0/24 subnet-id '2'
set service dhcp-server shared-network-name LAN-B subnet 192.168.20.0/24 option default-router '192.168.20.1'
set service dhcp-server shared-network-name LAN-B subnet 192.168.20.0/24 option name-server '192.168.20.1'
set service dhcp-server shared-network-name LAN-B subnet 192.168.20.0/24 range 0 start '192.168.20.100'
set service dhcp-server shared-network-name LAN-B subnet 192.168.20.0/24 range 0 stop '192.168.20.199'
set service dhcp-server shared-network-name LAN-B subnet 192.168.20.0/24 lease '3600'
