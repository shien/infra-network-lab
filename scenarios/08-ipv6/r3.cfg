# 08-ipv6: r3 — 01-lan の IPv4 構成に IPv6 を重ねる(RA で SLAAC、経路は OSPFv3)
set interfaces ethernet eth1 address '192.168.20.1/24'
set interfaces ethernet eth1 address '2001:db8:b::1/64'
set interfaces ethernet eth1 description 'LAN-B'
set interfaces ethernet eth2 address '10.0.23.2/30'
set interfaces ethernet eth2 address '2001:db8:23::2/64'
set interfaces ethernet eth2 description 'WAN to r2'
set protocols static route 192.168.10.0/24 next-hop '10.0.23.1'
set protocols static route 10.0.12.0/30 next-hop '10.0.23.1'
set service router-advert interface eth1 prefix 2001:db8:b::/64
set protocols ospfv3 parameters router-id '10.255.0.3'
set protocols ospfv3 interface eth1 area '0.0.0.0'
set protocols ospfv3 interface eth1 passive
set protocols ospfv3 interface eth2 area '0.0.0.0'
